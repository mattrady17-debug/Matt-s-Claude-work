name: Daily stock monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the email, send nothing)"
        type: boolean
        default: true
  # GitHub cron runs on UTC and fires late - often by HOURS - on its shared
  # best-effort scheduler. The program is delay-proof: every firing evaluates
  # the most recent trading day whose after-hours session (20:00 ET) is over,
  # and a sent-marker in state/state.json guarantees exactly one email per
  # trading day no matter how many firings arrive or how late.
  #   00:47 UTC = 20:47 EDT (evening send in summer)
  #   01:47 UTC = 20:47 EST (evening send in winter; no-op in summer)
  #   10:47 UTC = morning catch-up in case both evening firings were lost
  # Off-peak minute (:47) chosen because :00/:30 slots are the most delayed.
  schedule:
    - cron: "47 0 * * 2-6"
    - cron: "47 1 * * 2-6"
    - cron: "47 10 * * 2-6"

concurrency:
  group: daily-monitor
  cancel-in-progress: false

permissions:
  contents: write   # to commit the anti-duplication state file back

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python -m monitor --dry-run --force
            else
              python -m monitor --force
            fi
          else
            python -m monitor
          fi

      - name: Commit updated state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- state/state.json; then
            git add state/state.json
            git commit -m "chore: record alerted events for $(date -u +%F)"
            git push
          else
            echo "No state changes to commit."
          fi
